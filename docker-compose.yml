services:
  postgres:
    image: postgres:15-alpine
    container_name: elt_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-warehouse}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-warehouse}"]
      interval: 3s
      timeout: 3s
      retries: 5

  mock_api:
    build:
      context: ./mock_api
      dockerfile: Dockerfile
    container_name: elt_mock_api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/transactions?page=1\")'"]
      interval: 3s
      timeout: 3s
      retries: 5
